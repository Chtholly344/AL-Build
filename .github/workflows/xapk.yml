name: XAPK AL JMBQ Build Work

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Select Game Server'
        required: true
        type: choice
        options:
          - 'TW'
          - 'EN'
          - 'JP'
          - 'KR(Broken)'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-android
      
      - name: Build APK
        run: |
          chmod +x assets/merge_build.sh
          ./assets/merge_build.sh "${{ github.event.inputs.region }}"

      - name: Release and Upload Assets
        uses: ncipollo/release-action@v1
        with:
          tag: "${{ env.JMBQ_VERSION }}-XAPK"
          name: "AL JMBQ ${{ env.JMBQ_VERSION }} Build XAPK"
          artifacts: "${{ github.event.inputs.region }}-V.${{ env.VERSION }}.7z.*"
          allowUpdates: true
          body: |
            <details>
            <summary>📖 中文安装说明</summary>

            1. 在下方 Assets 列表中找到你需要的版本前缀，下载对应所有 `7z.00*` 文件
            2. 选择 `XXX.7z.001` 解压
            3. 在解压后的文件夹中找到 XAPK 文件并安装

            > **注意**：重新打包后签名与原版不一致，第三方快捷登录可能失效，建议使用扫码或验证码登录。
            </details>

            <details>
            <summary>📖 English Installation Instructions</summary>

            1. Find your server prefix in the Assets list below, download all `7z.00*` files
            2. Extract `XXX.7z.001` to get the XAPK
            3. Install the XAPK on your device

            > **Note**: The app signature differs from the official version. Third-party login may not work — use QR code or SMS verification instead.
            </details>
