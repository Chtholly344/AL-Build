name: Generate & Release

on:
  push:
    tags:
      - v*

env:
  JAVA_VERSION: "21"
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  # ===================================================================
  # Job 1：prepare — 获取配置、验证、生成构建矩阵 & Release body 模板
  # ===================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: 定义硬编码 XAPK 区服
        id: xapk-servers
        run: |
          XAPK_SERVERS='[
            {"id":"TW","type":"xapk","region":"TW","label":"碧蓝航线 TW"},
            {"id":"EN","type":"xapk","region":"EN","label":"Azur Lane EN"},
            {"id":"JP","type":"xapk","region":"JP","label":"アズールレーン JP"}
          ]'
          echo "xapk_servers=$XAPK_SERVERS" >> "$GITHUB_OUTPUT"

      - name: 获取 APK 区服配置
        id: apk-servers
        run: |
          URL="${{ vars.SERVER_CONFIG_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::SERVER_CONFIG_URL 未设置，仅构建硬编码的 XAPK 区服。"
            echo "apk_servers=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "从 $URL 获取 APK 区服配置..."
          curl -sL "$URL" -o server_config.json
          APK_SERVERS=$(jq -c '[.servers[] | select(.type == "apk")]' server_config.json)
          echo "apk_servers=$APK_SERVERS" >> "$GITHUB_OUTPUT"

      - name: 合并区服列表并生成构建矩阵
        id: set-matrix
        run: |
          XAPK='${{ steps.xapk-servers.outputs.xapk_servers }}'
          APK='${{ steps.apk-servers.outputs.apk_servers }}'
          ALL_SERVERS=$(jq -c -n --argjson x "$XAPK" --argjson a "$APK" '$x + $a')
          COUNT=$(echo "$ALL_SERVERS" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::没有区服可构建！"
            exit 1
          fi
          echo "✅ 共 $COUNT 个区服待构建："
          echo "$ALL_SERVERS" | jq -r '.[] | "   - \(.label) [\(.type)]"'
          echo "matrix={\"server\":$ALL_SERVERS}" >> "$GITHUB_OUTPUT"
          echo "$ALL_SERVERS" > merged_servers.json

      - name: Generate release body header
        run: |
          cat > release_body_header.md << 'EOF'
          > `${{ github.ref_name }}` 自动构建

          <details open>
          <summary><b>📋 Servers built in this release</b></summary>

          EOF
          jq -r '.[] | "  - \(.label) (`\(.type)`)"' merged_servers.json >> release_body_header.md
          cat >> release_body_header.md << 'EOF'

          </details>

          ---

          <details>
          <summary><b>📖 中文安装说明</b></summary>

          1. 在下方 Assets 列表中找到你需要的版本前缀，下载对应所有 `7z.00*` 文件
          2. 选择 `XXX.7z.001` 解压
          3. 在解压后的文件夹中找到 APK / XAPK 文件并安装

          > **注意**：重新打包后签名与原版不一致，第三方快捷登录可能失效，建议使用扫码或验证码登录。

          </details>

          <details>
          <summary><b>📖 English Installation Instructions</b></summary>

          1. Find your server prefix in the Assets list below, download all `7z.00*` files
          2. Extract `XXX.7z.001` to get the APK / XAPK
          3. Install the APK / XAPK on your device

          > **Note**: The app signature differs from the official version. Third-party login may not work — use QR code or SMS verification instead.

          </details>

          <details>
          <summary><b>📝 变更日志 / Changelog</b></summary>

          EOF

      - name: Upload release body header
        uses: actions/upload-artifact@v4
        with:
          name: release-body-header
          path: release_body_header.md
          retention-days: 1

  # ===================================================================
  # Job 2：build — 矩阵并行构建所有区服
  # ===================================================================
  build:
    # 显式指定作业显示名：matrix.server 是对象，若不指定 name，
    # GitHub 会把整个对象（id/type/url/label...）拼进自动生成的作业名，
    # 显示成 build({"id":"Bilibili","type":"apk",...}) 这样的一长串。
    # 显示名优先用 label，label 缺失时才回退到 id（不会两者拼接）。
    name: "${{ matrix.server.label || matrix.server.id }}"
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-android
        with:
          java-version: ${{ env.JAVA_VERSION }}
          build-tools-version: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Run build script
        id: build_step
        shell: bash
        run: |
          chmod +x assets/merge_build.sh
          if [ "${{ matrix.server.type }}" = "xapk" ]; then
            echo "🔧 XAPK mode — region: ${{ matrix.server.region }}"
            ./assets/merge_build.sh "${{ matrix.server.region }}"
          else
            echo "🔧 APK mode — server: ${{ matrix.server.id }}"
            ./assets/merge_build.sh "${{ matrix.server.id }}" "${{ matrix.server.url }}"
          fi

      - name: List built artifacts
        run: |
          echo "=== Built files for ${{ matrix.server.id }} ==="
          ls -la *.7z.* 2>/dev/null || echo "(no 7z files at root)"
          ls -la */*.7z.* 2>/dev/null || echo "(no 7z files in subdirs)"

      - name: Upload artifacts for ${{ matrix.server.id }}
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.server.id }}
          path: "*.7z.*"
          if-no-files-found: error
          retention-days: 1

  # ===================================================================
  # Job 3：release — 生成变更日志、收集产物、创建 Release
  # ===================================================================
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 拉取完整历史以生成变更日志

      - name: Download release body header
        uses: actions/download-artifact@v4
        with:
          name: release-body-header
          path: release_body

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and flatten release assets
        run: |
          mkdir -p release_assets
          find artifacts -type f -name "*.7z.*" -exec cp -v {} release_assets/ \;
          echo ""
          echo "=== Collected release assets ($(ls release_assets/ | wc -l) files) ==="
          ls -la release_assets/

      - name: Generate changelog from git log
        run: |
          {
            echo ""
            PREV_TAG=$(git describe --tags --abbrev=0 @^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since **$PREV_TAG**:"
              echo ""
              git log "$PREV_TAG"..@ --oneline --no-decorate | while read hash msg; do
                echo "  - $msg"
              done
            else
              echo "Initial release — no previous tag found."
            fi
            echo ""
            echo "</details>"
          } >> release_body/release_body_header.md

      - name: Show final release body
        run: cat release_body/release_body_header.md

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: "AL JMBQ ${{ github.ref_name }} Build"
          artifacts: "release_assets/*"
          artifactContentType: application/octet-stream
          bodyFile: release_body/release_body_header.md
          allowUpdates: false
          skipIfReleaseExists: true