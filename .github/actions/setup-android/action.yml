# JDK → Android SDK → build-tools
name: Setup Android Build Environment
description: Install Java JDK, Android SDK, and build-tools for APK/XAPK building

inputs:
  java-version:
    description: Java JDK version
    default: "21"
  build-tools-version:
    description: Android build-tools version
    default: "36.0.0"

runs:
  using: "composite"
  steps:
    - name: Setup Java JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: "temurin"

    - name: Set up Android SDK and build-tools
      uses: android-actions/setup-android@v4
      with:
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: false
        packages: "build-tools;${{ inputs.build-tools-version }}"